# Deploy: from edge/api, with CLOUDFLARE_API_TOKEN set: npx wrangler@4 deploy
# The secret is set once with: npx wrangler@4 secret put ORIGIN_AUTH (the same value as the API's origin-auth Container Apps secret,
# kept in the local secret store as lifestream-origin-auth)
name = "lifestream-api-edge"
main = "index.js"
compatibility_date = "2026-11-01"
account_id = "803b01a6e3e53ef41f175e2a54e51372"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.lifestream.himaiz.com", custom_domain = true }]

[vars]
ORIGIN = "https://lifestream-api.mangotree-b12eb44b.eastus.azurecontainerapps.io"

[observability]
enabled = true
