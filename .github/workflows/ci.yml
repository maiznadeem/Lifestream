name: CI

# The gate. A pull request cannot merge when any job here fails: the build treats every compiler, analyzer and
# NuGet audit warning as an error, and every test must pass.
on:
  pull_request:
  push:
    branches: [master, overhaul]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: api (build, analyzers, Domain/Data/Api/Client tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # SQL Server 2025 for the data and API tests. Started here instead of as a `services:` block so the SA password is
      # generated per run and masked, never written into the repository.
      - name: Start SQL Server 2025
        run: |
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker run -d --name lifestream-sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" \
            mcr.microsoft.com/mssql/server:2025-latest
          echo "LIFESTREAM_TEST_SQL=Server=localhost,1433;User Id=sa;Password=$password;TrustServerCertificate=true" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker logs lifestream-sql 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              echo "SQL Server ready after $attempt checks"
              exit 0
            fi
            sleep 2
          done
          docker logs lifestream-sql | tail -50
          echo "SQL Server did not become ready" >&2
          exit 1

      - name: Build (warnings are errors)
        run: >
          dotnet build tests/Lifestream.Domain.Tests tests/Lifestream.Client.Tests tests/Lifestream.Api.Tests
          -c Release

      # Test output is kept (bash with pipefail: a failing test run still fails the step) and scanned for credentials.
      - name: Test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/test-logs"
          dotnet test tests/Lifestream.Domain.Tests -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/test-logs/domain.log"
          dotnet test tests/Lifestream.Client.Tests -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/test-logs/client.log"
          dotnet test tests/Lifestream.Api.Tests -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/test-logs/api.log"

      - name: Scan the test logs for credentials
        if: always()
        shell: pwsh
        run: ./tools/scan-artifacts.ps1 -Path "$env:RUNNER_TEMP/test-logs" -ReportPath "$env:RUNNER_TEMP/scan-test-logs.json"

  desktop:
    name: desktop (build whole solution, Desktop tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The runner context is not available in a job-level env, so the capture folder is set for the later steps here.
      - name: Set the render capture folder
        run: '"LIFESTREAM_CAPTURE_DIR=$env:RUNNER_TEMP\captures" >> $env:GITHUB_ENV'

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Gate, build (whole solution, warnings are errors)
        run: dotnet build Lifestream.slnx -c Release

      - name: Gate, Desktop and Client tests (off-screen renders, no window is shown)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/test-logs", "$env:LIFESTREAM_CAPTURE_DIR" | Out-Null
          dotnet test tests/Lifestream.Client.Tests -c Release --no-build 2>&1 | Tee-Object "$env:RUNNER_TEMP/test-logs/client.log"
          $client = $LASTEXITCODE
          dotnet test tests/Lifestream.Desktop.Tests -c Release --no-build 2>&1 | Tee-Object "$env:RUNNER_TEMP/test-logs/desktop.log"
          $desktop = $LASTEXITCODE
          if ($client -ne 0 -or $desktop -ne 0) { exit 1 }

      # The captures are uploaded only after they and the test logs were scanned clean.
      - name: Scan the test logs and render captures for credentials
        id: scan-logs
        if: always()
        run: ./tools/scan-artifacts.ps1 -Path "$env:RUNNER_TEMP/test-logs","$env:LIFESTREAM_CAPTURE_DIR" -ReportPath "$env:RUNNER_TEMP/scan-test-logs.json"

      - name: Upload render captures
        if: always() && steps.scan-logs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-captures
          path: ${{ runner.temp }}\captures
          if-no-files-found: ignore

  # xUnit's default test order comes from the test assembly's path, so a test that leaks state into another passes in one checkout and
  # fails in the next. A seeded order is the same on every machine, so this job runs every test project under two fixed seeds
  # (`Lifestream.X.Tests :<seed>`, the xUnit v3 runner's seed argument) and fails the pull request when any run fails. A failing seed
  # is reproduced locally with the same command; the build is the one the other jobs already prove.
  test-order:
    name: test order (${{ matrix.name }}, two fixed seeds each)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Domain, Client, Api
            os: ubuntu-latest
            projects: "Domain Client Api"
            sql: true
          - name: Desktop
            os: windows-latest
            projects: "Desktop"
            sql: false
    env:
      SEEDS: "20260101 987654321"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start SQL Server 2025
        if: matrix.sql
        run: |
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker run -d --name lifestream-sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" \
            mcr.microsoft.com/mssql/server:2025-latest
          echo "LIFESTREAM_TEST_SQL=Server=localhost,1433;User Id=sa;Password=$password;TrustServerCertificate=true" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker logs lifestream-sql 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              echo "SQL Server ready after $attempt checks"
              exit 0
            fi
            sleep 2
          done
          docker logs lifestream-sql | tail -50
          echo "SQL Server did not become ready" >&2
          exit 1

      - name: Build the test projects (warnings are errors)
        shell: bash
        run: |
          for project in ${{ matrix.projects }}; do
            dotnet build "tests/Lifestream.$project.Tests" -c Release
          done

      # Every project and seed runs even when an earlier one failed, so one pull request shows all the order failures at once.
      - name: Test, two fixed seeds per project
        shell: bash
        env:
          LIFESTREAM_CAPTURE_DIR: ${{ runner.temp }}/captures
        run: |
          mkdir -p "$RUNNER_TEMP/test-logs" "$LIFESTREAM_CAPTURE_DIR"
          DOTNET_HOST_PATH="$(command -v dotnet)"
          export DOTNET_HOST_PATH
          fail=0
          root="$PWD"
          for project in ${{ matrix.projects }}; do
            outputs=("$root/tests/Lifestream.$project.Tests/bin/Release/"net11.0*)
            dir="${outputs[0]}"
            exe="$dir/Lifestream.$project.Tests"
            if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
            for seed in $SEEDS; do
              echo "::group::$project, seed $seed"
              set +e
              (cd "$dir" && "$exe" ":$seed" -noLogo -notrait "Category=Perf" 2>&1) | tee "$RUNNER_TEMP/test-logs/order-$project-$seed.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "::endgroup::"
              if [ "$status" -ne 0 ]; then
                echo "::error::$project failed under seed $seed (exit $status). Reproduce: Lifestream.$project.Tests :$seed"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Scan the test logs for credentials
        if: always()
        shell: pwsh
        run: ./tools/scan-artifacts.ps1 -Path "$env:RUNNER_TEMP/test-logs" -ReportPath "$env:RUNNER_TEMP/scan-test-logs.json"

