name: Secret scan

# Fails on any database credential, JWT or private key (UTF-8 and UTF-16) in the repository (every tracked file), its history,
# the built desktop and API binaries and configs, the build logs and every layer of the API container image. ci.yml stays the build-and-test gate;
# this workflow is the credential gate. GitHub's own secret scanning and push protection are switched on in the repository
# settings (see infra/README.md).
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  repository:
    name: repository tree and history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Source and configuration folders only. Workflow files and docs legitimately mention connection-string keywords
      # (for example the throw-away SQL Server password the CI generates per run), so they are covered by gitleaks below
      # instead; the strict artifact scan is for what is built and shipped.
      - name: Scan the source and configuration folders
        shell: pwsh
        run: ./tools/scan-artifacts.ps1 -Path src,tests,infra,packaging -GitTracked -ReportPath "$env:RUNNER_TEMP/scan-tree.json"

      - name: Scan the full git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  desktop:
    name: desktop build output and logs
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish the desktop app (win-x64, self-contained) and keep the log
        shell: pwsh
        run: >
          dotnet publish src/Lifestream.Desktop -c Release -r win-x64 --self-contained
          -o "$env:RUNNER_TEMP/desktop" 2>&1 | Tee-Object "$env:RUNNER_TEMP/desktop-publish.log"

      - name: Publish the API (framework-dependent) and keep the log
        shell: pwsh
        run: >
          dotnet publish src/Lifestream.Api -c Release -o "$env:RUNNER_TEMP/api"
          2>&1 | Tee-Object "$env:RUNNER_TEMP/api-publish.log"

      - name: Scan binaries, configs and logs
        shell: pwsh
        run: >
          ./tools/scan-artifacts.ps1
          -Path "$env:RUNNER_TEMP/desktop","$env:RUNNER_TEMP/api","$env:RUNNER_TEMP/desktop-publish.log","$env:RUNNER_TEMP/api-publish.log"
          -ReportPath "$env:RUNNER_TEMP/scan-desktop.json"

      - name: Upload the report (no values, only file, rule and offset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-desktop-report
          path: ${{ runner.temp }}/scan-desktop.json
          if-no-files-found: ignore

  api-image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image locally (nothing is pushed) and keep the build log
        shell: bash
        run: >
          docker buildx build --progress=plain --provenance=false --sbom=false --platform linux/amd64 --load
          -f src/Lifestream.Api/Dockerfile -t lifestream-api:scan . 2>&1 | tee "$RUNNER_TEMP/docker-build.log"

      # Every layer separately (docker save), the image configuration, and the build output.
      - name: Scan the image layers, configuration and build log
        run: |
          tools/scan-image.sh lifestream-api:scan "$RUNNER_TEMP/scan-image.json"
          pwsh -NoProfile -File tools/scan-artifacts.ps1 -Path "$RUNNER_TEMP/docker-build.log" -ReportPath "$RUNNER_TEMP/scan-build-log.json"

      - name: Upload the report (no values, only file, rule and offset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-image-report
          path: |
            ${{ runner.temp }}/scan-image.json
            ${{ runner.temp }}/scan-build-log.json
          if-no-files-found: ignore
