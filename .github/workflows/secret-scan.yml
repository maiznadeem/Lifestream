name: Secret scan

# Fails on any database credential, JWT or private key (UTF-8 and UTF-16). GitHub's own secret scanning and push protection are
# switched on in the repository settings (see infra/README.md).
#
# What starts by itself is the `repository` job only (about 20 seconds): every tracked file of src, tests, infra and packaging, and
# the commits of the pull request or of the push to master. One push starts one run: a branch is scanned by its pull request, master
# by the push of the merge; a tag starts nothing. A newer push cancels the older run.
#
# The built artifacts are scanned where they are made, not here on every push:
#   - the desktop publish folder, the installer and the update packages: tools/release-local.ps1 (and release.yml), before anything is uploaded;
#   - every layer of the API image, its configuration and the build log: deploy-api.yml, before the image is pushed.
# The `desktop` and `api-image` jobs below do the same scans on a runner and run only when this workflow is started by hand.
#
# There is no weekly run, and a run started by hand does not scan the history: a scan of the WHOLE history reports 22 hits (5 are the
# 1.x SQL login hard-coded in three old commits, requirement INFRA-02, an owner decision; 17 are false positives in tests), so it
# would be red every time. The history is scanned commit by commit as it arrives (pull request, push to master).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  repository:
    name: repository tree and history
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Source and configuration folders only. Workflow files and docs legitimately mention connection-string keywords
      # (for example the throw-away SQL Server password the CI generates per run), so they are covered by gitleaks below
      # instead; the strict artifact scan is for what is built and shipped.
      - name: Scan the source and configuration folders
        shell: pwsh
        run: ./tools/scan-artifacts.ps1 -Path src,tests,infra,packaging -GitTracked -ReportPath "$env:RUNNER_TEMP/scan-tree.json"

      # gitleaks-action scans the commits of the event: the pull request's commits, or the pushed range on master.
      - name: Scan the history (the commits of this pull request or push)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  desktop:
    name: desktop build output and logs
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish the desktop app (win-x64, self-contained) and keep the log
        shell: pwsh
        run: >
          ./tools/run-logged.ps1 -Log "$env:RUNNER_TEMP/desktop-publish.log" -Command
          'dotnet publish src/Lifestream.Desktop -c Release -r win-x64 --self-contained -o "$env:RUNNER_TEMP/desktop"'

      # The API ships only as the linux-x64 container image, so it is published here exactly as src/Lifestream.Api/Dockerfile
      # publishes it (same runtime identifier and switches; tests/infra/Workflows.Tests.ps1 keeps the two in step). A publish
      # without a runtime identifier copies the native libraries of every platform (macOS, Windows, musl) into runtimes/,
      # files that are in no shipped artifact. The image itself, layer by layer, is scanned by the api-image job below.
      - name: Publish the API as the image does (linux-x64, framework-dependent) and keep the log
        shell: pwsh
        run: >
          ./tools/run-logged.ps1 -Log "$env:RUNNER_TEMP/api-publish.log" -Command
          'dotnet publish src/Lifestream.Api -c Release -r linux-x64 --self-contained false -p:UseAppHost=false -o "$env:RUNNER_TEMP/api"'

      - name: Scan binaries, configs and logs
        shell: pwsh
        run: >
          ./tools/scan-artifacts.ps1
          -Path "$env:RUNNER_TEMP/desktop","$env:RUNNER_TEMP/api","$env:RUNNER_TEMP/desktop-publish.log","$env:RUNNER_TEMP/api-publish.log"
          -ReportPath "$env:RUNNER_TEMP/scan-desktop.json"

      - name: Upload the report (no values, only file, rule and offset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-desktop-report
          path: ${{ runner.temp }}/scan-desktop.json
          if-no-files-found: ignore

  api-image:
    name: API container image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the image locally (nothing is pushed) and keep the build log
        shell: bash
        run: >
          pwsh -NoProfile -File tools/run-logged.ps1 -Log "$RUNNER_TEMP/docker-build.log" -Command
          "docker buildx build --progress=plain --provenance=false --sbom=false --platform linux/amd64 --load
          -f src/Lifestream.Api/Dockerfile -t lifestream-api:scan ."

      # Every layer separately (docker save), the image configuration, and the build output.
      - name: Scan the image layers, configuration and build log
        run: |
          tools/scan-image.sh lifestream-api:scan "$RUNNER_TEMP/scan-image.json"
          pwsh -NoProfile -File tools/scan-artifacts.ps1 -Path "$RUNNER_TEMP/docker-build.log" -ReportPath "$RUNNER_TEMP/scan-build-log.json"

      - name: Upload the report (no values, only file, rule and offset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-image-report
          path: |
            ${{ runner.temp }}/scan-image.json
            ${{ runner.temp }}/scan-build-log.json
          if-no-files-found: ignore
